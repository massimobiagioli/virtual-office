# Serves the My Workbench SPA and proxies the API to core (DOCKER.md §4.3).
# Included inside the `http` block of the image's nginx.conf. A location that sets its own
# add_header drops the inherited ones, so each of them includes security-headers.conf again.

log_format vo_json escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"duration":$request_time,"user_agent":"$http_user_agent"}';

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  access_log /dev/stdout vo_json;

  include /etc/nginx/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://core:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://core:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Hashed build output: cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # SPA fallback: every other path is a deep link served by index.html, never cached.
  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
