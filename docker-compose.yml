# Virtual Office stack (Compose Specification, no `version:` key). Drive it with `make`.
# Each subproject adds its own service here, built from its own folder (ADR-0004):
# core (US-01.02), agents-catalog (US-01.03), frontend (US-01.05); WP02 hardens the stack
# (healthchecks, security defaults, resource limits, network, postgres, ollama).
name: virtual-office

services:
  core:
    image: virtual-office/core:${VO_IMAGE_TAG:-dev}
    build:
      context: services/core
      target: runtime
    environment:
      # Addresses on the compose network; the services behind them arrive in WP02/WP04.
      VO_DATABASE_URL: postgresql+asyncpg://core_app@postgres:5432/core
      VO_CATALOG_URL: http://agents-catalog:8001/
      VO_OLLAMA_BASE_URL: ${VO_OLLAMA_BASE_URL:-http://ollama:11434/}
