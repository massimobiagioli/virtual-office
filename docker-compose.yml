# Virtual Office stack (Compose Specification, no `version:` key). Drive it with `make`.
# Each subproject adds its own service here, built from its own folder (ADR-0004):
# core (US-01.02), catalog (US-01.03), frontend (US-01.05); WP02 hardens the stack
# (healthchecks, security defaults, resource limits, network, postgres, ollama).
name: virtual-office

services:
  frontend:
    # Same temporary image tag default as core (ADR-0006); WP02 makes it required.
    image: virtual-office/frontend:${VO_IMAGE_TAG:-dev}
    build:
      context: frontend
      target: runtime
    # The only published port of the stack, bound to the loopback interface (DOCKER.md §5.2).
    ports:
      - "127.0.0.1:8080:8080"
    # nginx resolves `core` (the /api and /ws upstream) at start-up; WP02 waits for it healthy.
    depends_on:
      - core

  core:
    # DOCKER.md §3 wants ${VO_IMAGE_TAG:?}; the `dev` default keeps `make status|logs|down`
    # working on a clean clone without a `.env` (see .env.example). WP02 makes it required.
    image: virtual-office/core:${VO_IMAGE_TAG:-dev}
    build:
      context: services/core
      target: runtime
    environment:
      # Addresses on the compose network; the services behind them arrive in WP02/WP04.
      VO_DATABASE_URL: postgresql+asyncpg://core_app@postgres:5432/core
      VO_CATALOG_URL: http://catalog:8001/
      VO_OLLAMA_BASE_URL: ${VO_OLLAMA_BASE_URL:-http://ollama:11434/}
      VO_LOG_LEVEL: ${VO_LOG_LEVEL:-INFO}

  catalog:
    # Same temporary image tag default as core (ADR-0006); WP02 makes it required.
    image: virtual-office/catalog:${VO_IMAGE_TAG:-dev}
    build:
      context: services/catalog
      target: runtime
    environment:
      # The catalog database arrives with postgres in WP02/WP04 (POSTGRES.md §2).
      VO_DATABASE_URL: postgresql+asyncpg://catalog_app@postgres:5432/catalog
      VO_LOG_LEVEL: ${VO_LOG_LEVEL:-INFO}
